# Configuration file for notification system
# Inspired by Astrbot's configuration format

# WeChat Configuration
[wechat]
enabled = true
api_url = http://localhost:8080
token = your_wechat_token_here
polling_interval = 2.0

# QQ Configuration
[qq]
enabled = true
api_url = http://localhost:5700
access_token = your_qq_token_here
qq_number = 123456789
polling_interval = 2.0

# General Settings
[general]
log_level = INFO
max_retries = 3
retry_delay = 5
